version: 2
updates:
  # Keep pinned action SHAs current — security advisories land here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The Babel family must move as a unit: @babel/* self-type since v8, so a
      # partial bump (e.g. only @babel/types) leaves a second, mismatched
      # @babel/types in the tree and breaks tsc. Listed first so babel updates
      # of ANY level (incl. majors) land in one PR instead of per-package ones.
      babel:
        patterns:
          - "@babel/*"
          - "@types/babel__*"
      # Same unit rule, different reason: @volar/* embed the TypeScript
      # compiler API, so a Volar bump that outpaces its supported tsc (or the
      # reverse) breaks the language plugin and verrex-check together. Also
      # ANY level, so the pair can never split across two PRs.
      typescript:
        patterns:
          - "typescript"
          - "@volar/*"
      # effect + @effect/* must move as a unit: two copies of the effect
      # types in the workspace (e.g. @effect/vitest resolved against an older
      # effect than apps/demo) break verrex-check on type-identity mismatch
      # — seen for real when the demo bumped ahead of core's peer pin.
      # Listed before minor-and-patch so these never land in separate PRs.
      effect:
        patterns:
          - "effect"
          - "@effect/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the Go port and ships NO compiler API — no
      # createLanguageService, no IScriptSnapshot, and no extraFileExtensions,
      # which is the hook that makes tsc accept .vx at all. Unblocking needs
      # TS 7.1's API + Volar on top of it + CLI support for embedded
      # languages; see #162 for the trigger conditions. Drop this entry when
      # they land — the group above then moves typescript and Volar together.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
